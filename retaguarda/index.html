<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FVG Retaguarda</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; margin: 0; }
    
    #tela-login {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #0c3d15; display: flex; align-items: center; justify-content: center; z-index: 1000;
        padding: 20px; box-sizing: border-box; /* Garante que não estoure em telas pequenas */
    }
    .login-box { 
        background: white; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; 
        text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    }
    .login-box h2 { color: #0c3d15; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    
    .login-box button { 
        width: 100%; padding: 12px; 
        background-color: oklch(55.4% 0.135 66.442); /* Cor Laranja Solicitada */
        color: white; border: none; border-radius: 5px; 
        cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; 
        transition: opacity 0.2s;
    }
    .login-box button:hover { opacity: 0.9; }

    #conteudo-restrito { display: none; } 

    .header-painel { 
        display: flex; justify-content: space-between; align-items: center; 
        max-width: 800px; margin: 0 auto 20px auto; 
    }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

    form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
    input[type=text], input[type=number] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    .grupo-categoria { border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 15px; background-color: #fff; }
    .cabecalho-categoria { display: flex; align-items: center; font-weight: bold; color: #0c3d15; font-size: 1.1em; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #eee; }
    .cabecalho-categoria input { width: 20px; height: 20px; margin-right: 10px; cursor: pointer; }
    
    .lista-subcategorias { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding-left: 10px; }
    .item-sub { display: flex; align-items: center; font-size: 0.95em; color: #4b5563; }
    .item-sub input { width: 16px; height: 16px; margin-right: 8px; cursor: pointer; }
    .item-sub label { cursor: pointer; }

    .table-container { max-width: 800px; margin: 40px auto; overflow-x: auto; } /* Ajustado para 800px para alinhar com form */
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-width: 600px; } /* Min-width garante scroll no celular */
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #0c3d15; color: white; }
    tr:hover { background-color: #f5f5f5; }
    
    .btn-action { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; color: white; margin-right: 5px; font-size: 0.9em; }
    .btn-edit { background-color: #eab308; }
    .btn-delete { background-color: #ef4444; }
    
    .promo-box { background-color: #fee2e2; border: 2px solid #ef4444; padding: 15px; margin: 20px 0; border-radius: 8px; display: flex; align-items: center; }
    .promo-box input { width: 25px; height: 25px; margin-right: 15px; cursor: pointer; }
    
    .btn-cancelar { background-color: #6b7280; display: none; margin-left: 10px; }

    @media (max-width: 768px) {
        body { padding: 10px; }
        
        .header-painel { 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 15px; 
        }
        
        .header-painel button { 
            width: 100%; 
        }

        .lista-subcategorias { 
            grid-template-columns: 1fr;
        }

        form { padding: 15px; }
        
        th, td { padding: 8px; font-size: 14px; }
        .btn-action { padding: 5px 8px; margin-bottom: 5px; display: inline-block; }
    }
  </style>
  
  <script type="module" src="script.js"></script>
</head>

<body>

  <div id="tela-login">
      <div class="login-box">
          <h2>🔐 Retaguarda FVG</h2>
          <input type="text" id="loginEmail" placeholder="Email administrativo">
          <input type="password" id="loginSenha" placeholder="Senha">
          <button id="btnEntrar">Entrar no Sistema</button>
      </div>
  </div>

  <div id="conteudo-restrito">
      
      <div class="header-painel">
          <h2 style="color: #0c3d15; margin: 0; font-size: 1.5em;">Retaguarda/Cadastros de produtos FVG</h2>
          <button id="btnSair" class="btn-logout">Sair (Logout)</button>
      </div>
      
      <div id="Cadastros">
        <form id="formCadastro" name="Cadastros">
          <input type="hidden" id="editId" value="">

          <label for="nomeProduto"><strong>Nome Do Produto:*</strong></label>
          <input type="text" id="nomeProduto" name="nomeProduto" required placeholder="Digite o nome do produto">
          
          <label for="preco"><strong>Preço (R$):*</strong></label>
          <input type="number" id="preco" name="preco" required step="0.01" placeholder="Ex: 10.50">
          
          <label for="descricao"><strong>Descrição:</strong></label>
          <input type="text" id="descricao" name="descricao" placeholder="Detalhes do produto...">
          
          <label for="imagemURL"><strong>Link Da Imagem (Google Drive/Imgur):</strong></label>
          <input type="text" id="imagemURL" name="imagemURL" placeholder="Cole o link da imagem aqui">

          <div class="promo-box">
            <input type="checkbox" id="emPromocao" name="emPromocao">
            <label for="emPromocao" style="font-weight: bold; color: #b91c1c; font-size: 1.1em; cursor: pointer;">
                Produto em promoção <br>
                <small style="font-weight: normal; color: #000; font-size: 0.8em;">(Se marcar, ele aparecerá na seção de Ofertas do site)</small>
            </label>
          </div>

          <h3 style="border-bottom: 2px solid #0c3d15; color: #0c3d15; margin-bottom: 20px;">Categorias E Subcategorias</h3>
          
          <div id="container-checkboxes"></div>
          
          <div style="margin-top: 30px; text-align: center;">
              <button type="submit" id="btnSalvar" style="padding: 12px 30px; background: #0c3d15; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; width: 100%; max-width: 250px;">Salvar Produto</button>
              <button type="button" id="btnCancelar" class="btn-cancelar" style="padding: 12px 30px; border: none; cursor: pointer; color: white; font-size: 16px; border-radius: 5px; width: 100%; max-width: 250px; margin-top: 10px;">Cancelar Edição</button>
          </div>
        </form>
      </div>

      <div class="table-container">
          <h3>Produtos Cadastrados</h3>
          <table id="tabelaProdutos">
              <thead>
                  <tr>
                      <th style="width: 30%;">Nome</th>
                      <th>Preço</th>
                      <th style="width: 30%;">Categorias</th>
                      <th>Promoção</th>
                      <th>Ações</th>
                  </tr>
              </thead>
              <tbody></tbody>
          </table>
      </div>
  </div>

</body>
</html>
